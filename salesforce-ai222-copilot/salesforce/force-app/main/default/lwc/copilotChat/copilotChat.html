<template>
    <lightning-card title="Assistant commercial" icon-name="standard:live_chat">
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="thread" aria-live="polite">
                <template if:true={noMessages}>
                    <p class="slds-text-color_weak">Posez une question sur vos opportunités, ou choisissez un exemple :</p>
                    <template for:each={suggestions} for:item="s">
                        <div key={s.key} class="slds-m-top_x-small">
                            <lightning-button variant="base" label={s.text} data-text={s.text} onclick={pick}></lightning-button>
                        </div>
                    </template>
                </template>
                <template for:each={messages} for:item="m">
                    <div key={m.key} class={m.cls}>
                        <pre class="text">{m.text}</pre>
                        <template if:true={m.hasRefs}><div class="refs">Références : {m.refs}</div></template>
                    </div>
                </template>
                <template if:true={busy}><lightning-spinner alternative-text="Réflexion" size="x-small"></lightning-spinner></template>
            </div>
            <div class="slds-grid slds-m-top_small">
                <div class="slds-col slds-grow">
                    <lightning-input label="Votre question" variant="label-hidden" placeholder="Ex. : Quelles actions pour l’opportunité <ID> ?" value={question} onchange={handleChange} onkeyup={handleKey}></lightning-input>
                </div>
                <lightning-button class="slds-m-left_x-small" variant="brand" label="Envoyer" onclick={send} disabled={disabled}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
