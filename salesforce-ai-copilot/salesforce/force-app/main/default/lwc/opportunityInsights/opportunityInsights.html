<template>
    <lightning-card title="AI Copilot" icon-name="standard:einstein_replies">
        <lightning-button slot="actions" label="Réanalyser" icon-name="utility:refresh" onclick={refresh} disabled={loading}></lightning-button>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:true={loading}><lightning-spinner alternative-text="Analyse en cours" size="small"></lightning-spinner></template>
            <template if:true={error}><div class="slds-text-color_error" role="alert">{error}</div></template>

            <template if:true={hasResult}>
                <div class="slds-grid slds-grid_vertical-align-end slds-m-bottom_x-small">
                    <div class="risk-number">{riskPct} %</div>
                    <div class="slds-m-left_small slds-text-color_weak">risque de perte · niveau {pred.risk_level} · priorité {pred.priority}/5</div>
                </div>
                <div class="gauge" role="img" aria-label="Jauge de risque de perte"><div class={gaugeClass} style={gaugeStyle}></div></div>

                <h3 class="slds-text-heading_small slds-m-top_large">Pourquoi ce score</h3>
                <ul class="slds-m-top_x-small">
                    <template for:each={factors} for:item="f">
                        <li key={f.key} class="factor">
                            <div class="factor-head"><span>{f.label}</span><span class="slds-text-color_weak">{f.value}</span></div>
                            <div class="f-track"><div class={f.barClass} style={f.barStyle}></div></div>
                            <div class="factor-hint">{f.hint}</div>
                        </li>
                    </template>
                </ul>

                <template if:true={summary}>
                    <h3 class="slds-text-heading_small slds-m-top_large">Résumé des échanges</h3>
                    <p class="slds-m-top_x-small">{summary.summary}</p>
                    <template if:true={hasNeeds}>
                        <p class="slds-text-title slds-m-top_small">Besoins</p>
                        <ul class="slds-list_dotted"><template for:each={summary.needs} for:item="n"><li key={n}>{n}</li></template></ul>
                    </template>
                    <template if:true={hasObjections}>
                        <p class="slds-text-title slds-m-top_small">Objections</p>
                        <ul class="slds-list_dotted"><template for:each={summary.objections} for:item="n"><li key={n}>{n}</li></template></ul>
                    </template>
                    <template if:true={hasCommitments}>
                        <p class="slds-text-title slds-m-top_small">Engagements</p>
                        <ul class="slds-list_dotted"><template for:each={summary.commitments} for:item="n"><li key={n}>{n}</li></template></ul>
                    </template>
                    <p class="slds-text-color_weak slds-m-top_small">Sources : {sourcesText} — généré par {summary.generated_by}</p>
                </template>

                <h3 class="slds-text-heading_small slds-m-top_large">Prochaines meilleures actions</h3>
                <template for:each={recommendations} for:item="r">
                    <div key={r.id} class="rec">
                        <div class="slds-grid slds-grid_align-spread">
                            <strong>{r.action}</strong>
                            <span class={r.badge}>{r.priority}</span>
                        </div>
                        <p class="slds-text-color_weak slds-m-vertical_xx-small">{r.justification}</p>
                        <template if:true={r.isEditing}>
                            <lightning-input label="Action modifiée" value={editText} onchange={handleEditText}></lightning-input>
                            <div class="slds-m-top_x-small">
                                <lightning-button variant="brand" label="Enregistrer" onclick={saveEdit}></lightning-button>
                                <lightning-button class="slds-m-left_x-small" label="Annuler" onclick={cancelEdit}></lightning-button>
                            </div>
                        </template>
                        <template if:true={r.pending}>
                            <template if:false={r.isEditing}>
                                <div class="slds-m-top_x-small">
                                    <lightning-button variant="brand" label="Accepter" data-id={r.id} onclick={accept}></lightning-button>
                                    <lightning-button class="slds-m-left_x-small" label="Modifier" data-id={r.id} onclick={startEdit}></lightning-button>
                                    <lightning-button class="slds-m-left_x-small" label="Rejeter" data-id={r.id} onclick={reject}></lightning-button>
                                </div>
                            </template>
                        </template>
                        <template if:false={r.pending}><p class="slds-text-color_success slds-m-top_x-small">Décision : {r.status}</p></template>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
